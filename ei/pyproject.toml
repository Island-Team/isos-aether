[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "ei"
version = "0.2.3"
description = "IsOS embodied intelligence runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "structlog>=24.1",
  "pydantic>=2.6",
  "websockets>=14.0",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "grpcio>=1.74",
  "grpcio-health-checking>=1.74",
  "googleapis-common-protos>=1.70",
  "protobuf>=6.31",
  "jsonschema>=4.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "coverage>=7.4",
  "ruff>=0.16",
  "pyright>=1.1.350",
  "import-linter>=2.0",
]
# Vector recall in the memory layer: plan recall and docs-corpus RAG over one
# sqlite-vec index. Without it recall degrades to
# keyword search and the pipeline test suite still passes.
vec = [
  "sqlite-vec>=0.1",
]

# Public wrappers delegate to these importable packages. The wheel
# deliberately defines no competing console scripts.
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ei" = ["native/*.so"]

[tool.pytest.ini_options]
cache_dir = "../data/cache/tools/pytest-ei"
asyncio_mode = "auto"
testpaths = ["tests", "."]
# Private programs are a separate import root in a source checkout.
pythonpath = ["..", ".", "package"]

[tool.ruff]
cache-dir = "../data/cache/tools/ruff-ei"
# `package/ei_ext/` and `tests/` are repository-local roots, not third-party imports.
src = [".", "package"]
indent-width = 2
extend-exclude = [
  "setup.py",
  "generated/eos/**",
]

[tool.ruff.lint.per-file-ignores]
# An absent or broken vector extension degrades recall, never startup;
# the composition root catches the optional import failure.
"core/system/launch.py" = ["BLE001"]

[tool.ruff.format]
indent-style = "space"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["__init__.py", "*.py", "contracts", "core", "generated", "io", "lib", "package"]
exclude = [
  "setup.py",
  "generated/eos/**",
]
executionEnvironments = [
  { root = ".", extraPaths = ["..", "."] },
  { root = "package", extraPaths = ["package", "."] },
]

[tool.importlinter]
# Private EI extensions ship outside the wheel but their boundary remains
# CI-enforced. Run from the repository root.
root_packages = ["ei", "ei_ext"]

[[tool.importlinter.contracts]]
name = "lib imports no ei module"
type = "forbidden"
source_modules = ["ei.lib"]
forbidden_modules = [
  "ei.io",
  "ei.contracts",
  "ei.bin",
  "ei.core",
  "ei_ext",
]

# Simulation and any other out-of-process backend see the leaf utilities and
# the wire contracts, nothing else: core hands extensions only `lib`.
[[tool.importlinter.contracts]]
name = "ei ext imports no ei implementation"
type = "forbidden"
source_modules = ["ei_ext"]
forbidden_modules = [
  "ei.io",
  "ei.bin",
  "ei.core",
]

[[tool.importlinter.contracts]]
name = "ei imports no private extensions"
type = "forbidden"
source_modules = ["ei"]
forbidden_modules = ["ei_ext"]

# Inside core the pipeline is acyclic. Listed consumer-first: data flows the
# other way (link -> perception -> queue -> context -> decision), and `ei.io`
# projects the result northbound from above core, so it may read everything
# below it (io.md: "ei.io may import core; core never imports io"). On the
# egress half, decision sits above safety and the primitive registry
# and the sole egress gate), and safety forwards to link.
[[tool.importlinter.contracts]]
name = "core pipeline layers"
type = "layers"
layers = [
  "ei.io",
  "ei.core.system.sandbox",
  "ei.core.cognition.decision",
  "ei.core.governance.safety",
  "ei.core.system.registry",
  "ei.core.cognition.memory",
  "ei.core.cognition.context",
  "ei.core.evidence.perception",
  "ei.core.cognition.missions",
  "ei.core.io.link",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.74",
]
