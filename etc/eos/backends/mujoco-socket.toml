version = "0.2.0"

[robot]
id = "demo-0"
name = "MuJoCo v2 demo"

[cores.isos.layers.eos_hardware.groups.camera.nodes.front]
id = "front"
node_type = "isos.eos_hardware.camera@v0.2"
label = "Front RGB camera"
description = "MuJoCo JPEG camera decoded to RGB8; depth unavailable"
frame_id = "front_camera_optical"
capabilities = ["rgb8"]

[cores.isos.layers.eos_hardware.groups.camera.nodes.front.adapter]
type = "mujoco-v2"

[cores.isos.layers.eos_hardware.groups.camera.nodes.front.adapter.settings]
socket_path = "/tmp/mujoco-v2.sock"
simulator_node = "cam-0"

[cores.isos.layers.eos_hardware.groups.camera.nodes.front.health_timing]
poll_interval_ms = 100
stale_after_ms = 500

[cores.isos.layers.eos_hardware.groups.camera.nodes.front.observation]
max_rate_hz = 30.0
max_payload_bytes = 8388608

[cores.isos.layers.eos_hardware.groups.base.nodes.drive]
id = "drive"
node_type = "isos.eos_hardware.base@v0.2"
label = "Planar base"
description = "MuJoCo base velocity controller"
frame_id = "base_link"
capabilities = ["body_velocity"]

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.adapter]
type = "mujoco-v2"

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.adapter.settings]
socket_path = "/tmp/mujoco-v2.sock"
simulator_node = "base-0"

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.health_timing]
poll_interval_ms = 100
stale_after_ms = 500

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.observation]
max_rate_hz = 50.0
max_payload_bytes = 4096

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.movement]
modes = ["body_velocity"]

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.movement.limits]
max_linear_m_s = 1.0
max_angular_rad_s = 1.5
max_velocity_lease_ms = 500

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm]
id = "arm"
node_type = "isos.eos_hardware.manipulator@v0.2"
label = "Six axis arm"
description = "MuJoCo six-joint position controller"
frame_id = "arm_base"
joint_names = ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
capabilities = ["joint_positions"]

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.adapter]
type = "mujoco-v2"

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.adapter.settings]
socket_path = "/tmp/mujoco-v2.sock"
simulator_node = "arm-0"

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.health_timing]
poll_interval_ms = 100
stale_after_ms = 500

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.observation]
max_rate_hz = 50.0
max_payload_bytes = 4096

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.movement]
modes = ["joint_positions"]

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.movement.limits]
max_joint_position_rad = 3.14
max_joint_speed_rad_s = 1.0

[cores.isos.layers.eos_dispatcher.groups.control.nodes.command]
id = "command"
node_type = "isos.eos_dispatcher.control@v0.2"
label = "EOS command dispatcher"
description = "Software node that admits movement through configured hardware nodes"
capabilities = ["admission", "status"]
references = ["cores/isos/layers/eos_hardware/groups/base/nodes/drive", "cores/isos/layers/eos_hardware/groups/manipulator/nodes/arm"]

[cores.isos.layers.eos_hardware.groups.base.nodes.drive.inputs.command]
node = "cores/isos/layers/eos_dispatcher/groups/control/nodes/command"
output = "base_command"

[cores.isos.layers.eos_hardware.groups.manipulator.nodes.arm.inputs.command]
node = "cores/isos/layers/eos_dispatcher/groups/control/nodes/command"
output = "manipulator_command"

