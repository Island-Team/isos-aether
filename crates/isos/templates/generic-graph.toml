version = "0.2.0"

[robot]
id = "demo-0"
name = "Async control and monitor demo"

[cores.isos.layers.ui.groups.button.nodes.trigger]
id = "trigger"
node_type = "isos.ui.button.trigger@v0.2"
label = "Forward: move arm"
description = "Submit an asynchronous movement; follow its result by event ID"

[cores.ei.layers.io.groups.input.nodes.trigger]
id = "trigger"
node_type = "ei.io.input.trigger@v0.2"
label = "EI input"
description = "Receive button activation"
inputs.activation = { node = "isos/ui/button/trigger", output = "activation" }

[cores.ei.layers.cognition.groups.intent.nodes.forwarder]
id = "forwarder"
node_type = "ei.cognition.intent.forwarder@v0.2"
label = "EI cognition"
description = "Pass activation with its event identity"
inputs.activation = { node = "ei/io/input/trigger", output = "activation" }

[cores.ei.layers.governance.groups.safety.nodes.gate]
id = "gate"
node_type = "ei.governance.safety.gate@v0.2"
label = "EI safety"
description = "Gate activation before EOS"
inputs.activation = { node = "ei/cognition/intent/forwarder", output = "activation" }

[cores.eos.layers.interface.groups.ingress.nodes.trigger]
id = "trigger"
node_type = "eos.interface.ingress.trigger@v0.2"
label = "EOS ingress"
description = "Receive gated activation"
inputs.activation = { node = "ei/governance/safety/gate", output = "activation" }

[cores.eos.layers.skill.groups.demo.nodes.joint_delta]
id = "joint_delta"
node_type = "eos.skill.demo.joint_delta@v0.2"
label = "Demo arm skill"
description = "Map activation to a small joint delta"
inputs.activation = { node = "eos/interface/ingress/trigger", output = "activation" }

[cores.eos.layers.dispatcher.groups.arm.nodes.delta]
id = "delta"
node_type = "eos.dispatcher.arm.delta@v0.2"
label = "Arm dispatcher"
description = "Admit the declared arm delta"
inputs.delta = { node = "eos/skill/demo/joint_delta", output = "delta" }

[cores.eos.layers.hardware.groups.mock.nodes.arm]
id = "arm"
node_type = "eos.hardware.mock.arm@v0.2"
label = "Mock six-joint arm"
description = "Hold six joint positions in memory"
frame_id = "mock_arm"
joint_names = ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6"]
capabilities = ["joint_positions"]
inputs.delta = { node = "eos/dispatcher/arm/delta", output = "delta" }
adapter = { type = "mock-arm", settings = {} }
health_timing = { poll_interval_ms = 10, stale_after_ms = 50 }
observation = { max_rate_hz = 100, max_payload_bytes = 1024 }
movement = { modes = ["joint_positions"], limits = { max_joint_position_rad = 3.14, max_joint_speed_rad_s = 1 } }

[cores.eos.layers.hardware.groups.mock.nodes.arm_observer]
id = "arm_observer"
node_type = "eos.hardware.mock.arm_observer@v0.2"
label = "Arm observation source"
description = "Source the independently sampled mock arm state without an actuator input"

[cores.eos.layers.dispatcher.groups.arm.nodes.monitor]
id = "monitor"
node_type = "eos.dispatcher.arm.monitor@v0.2"
label = "EOS arm safety monitor"
description = "Check every local arm sample before command admission"
inputs.observation = { node = "eos/hardware/mock/arm_observer", output = "observation" }

[cores.eos.layers.skill.groups.demo.nodes.arm_status]
id = "arm_status"
node_type = "eos.skill.demo.arm_status@v0.2"
label = "EOS skill status"
description = "Pass checked arm state toward the interface"
inputs.observation = { node = "eos/dispatcher/arm/monitor", output = "observation" }

[cores.eos.layers.interface.groups.egress.nodes.arm_status]
id = "arm_status"
node_type = "eos.interface.egress.arm_status@v0.2"
label = "EOS monitor egress"
description = "Publish the latest checked arm observation to EI"
inputs.observation = { node = "eos/skill/demo/arm_status", output = "observation" }

[cores.ei.layers.io.groups.input.nodes.arm_status]
id = "arm_status"
node_type = "ei.io.input.arm_status@v0.2"
label = "EI monitor input"
description = "Receive run-fenced arm state from EOS"
inputs.observation = { node = "eos/interface/egress/arm_status", output = "observation" }

[cores.ei.layers.cognition.groups.state.nodes.arm_status]
id = "arm_status"
node_type = "ei.cognition.state.arm_status@v0.2"
label = "EI cognition state"
description = "Pass the observed arm state through cognition"
inputs.observation = { node = "ei/io/input/arm_status", output = "observation" }

[cores.ei.layers.governance.groups.monitor.nodes.arm_status]
id = "arm_status"
node_type = "ei.governance.monitor.arm_status@v0.2"
label = "EI monitor governance"
description = "Validate the arm observation before presentation"
inputs.observation = { node = "ei/cognition/state/arm_status", output = "observation" }
settings = { forward_rate_hz = 10 }

[cores.isos.layers.ui.groups.monitor.nodes.arm]
id = "arm"
node_type = "isos.ui.monitor.arm@v0.2"
label = "Return: arm state"
description = "Read the latest arm state independently of movement completion"
inputs.observation = { node = "ei/governance/monitor/arm_status", output = "observation" }
settings = { refresh_rate_hz = 5 }
