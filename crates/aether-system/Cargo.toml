[package]
name = "aether-system"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[dependencies]
aether-hal = { path = "../aether-hal" }
aether-node = { path = "../aether-node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
